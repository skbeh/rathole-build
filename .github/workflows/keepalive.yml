name: Keepalive

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  actions: write

jobs:
  keepalive:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: futuretech6/keepalive-workflow@221bbbe095748a836dd3ed2fa064189214a1f401
        with:
          workflow_files: "i686.yml, x86_64.yml"
